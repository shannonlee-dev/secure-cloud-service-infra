<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Mission 6 Web Service Architecture</title>
  <desc id="desc">AWS Seoul region web service architecture with DuckDNS, Internet Gateway, Route Table, Security Group, EC2, Docker, and nginx traffic flow.</desc>
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1d1d1f" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0071e3"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8e8e93"/>
    </marker>
    <style>
      @font-face {
        font-family: "NotoKR";
        src: url("file:///home/shannon/__dev/Font/NotoSansKR-Regular.otf") format("opentype");
        font-weight: 400;
      }
      @font-face {
        font-family: "NotoKR";
        src: url("file:///home/shannon/__dev/Font/NotoSansKR-Medium.otf") format("opentype");
        font-weight: 500;
      }
      @font-face {
        font-family: "NotoKR";
        src: url("file:///home/shannon/__dev/Font/NotoSansKR-Bold.otf") format("opentype");
        font-weight: 700;
      }
      .bg { fill: #f5f5f7; }
      .surface { fill: #ffffff; stroke: #d2d2d7; stroke-width: 1.4; }
      .panel { fill: #fbfbfd; stroke: #d2d2d7; stroke-width: 1.2; }
      .subtle { fill: #f5f5f7; stroke: #d2d2d7; stroke-width: 1; }
      .network { fill: #f5f9ff; stroke: #2997ff; stroke-width: 1.8; }
      .endpoint { fill: #edf6ff; stroke: #0071e3; stroke-width: 2; }
      .security { fill: #fff7f5; stroke: #ff453a; stroke-width: 1.8; stroke-dasharray: 8 8; }
      .compute { fill: #fffaf2; stroke: #ff9f0a; stroke-width: 1.8; }
      .runtime { fill: #f7fcf9; stroke: #34c759; stroke-width: 1.6; }
      .app { fill: #f0fbf4; stroke: #30d158; stroke-width: 1.8; }
      .flowBlue { fill: none; stroke: #0071e3; stroke-width: 4; marker-end: url(#arrowBlue); }
      .flowBlueThin { fill: none; stroke: #0071e3; stroke-width: 3; marker-end: url(#arrowBlue); }
      .flowGray { fill: none; stroke: #8e8e93; stroke-width: 2.2; marker-end: url(#arrowGray); }
      .labelBg { fill: #ffffff; stroke: #e5e5ea; stroke-width: 1; }
      .title { font: 700 34px NotoKR, -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, Arial, sans-serif; fill: #1d1d1f; }
      .subtitle { font: 400 17px NotoKR, -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Arial, sans-serif; fill: #6e6e73; }
      .section { font: 700 18px NotoKR, -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Arial, sans-serif; fill: #1d1d1f; }
      .caption { font: 500 14px NotoKR, -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Arial, sans-serif; fill: #6e6e73; }
      .cardTitle { font: 700 19px NotoKR, -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Arial, sans-serif; fill: #1d1d1f; }
      .cardBody { font: 400 16px NotoKR, -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Arial, sans-serif; fill: #1d1d1f; }
      .small { font: 400 14px NotoKR, -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Arial, sans-serif; fill: #6e6e73; }
      .label { font: 600 14px NotoKR, -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Arial, sans-serif; fill: #1d1d1f; }
    </style>
  </defs>

  <rect class="bg" width="1920" height="1080"/>
  <text class="title" x="80" y="82">Mission 6 Web Service Architecture</text>
  <text class="subtitle" x="80" y="114">Seoul region public web traffic, least-exposed Security Group, Dockerized nginx service</text>

  <rect class="surface" x="64" y="148" width="1792" height="852" rx="34" filter="url(#softShadow)"/>

  <rect class="panel" x="104" y="210" width="430" height="710" rx="26"/>
  <text class="section" x="136" y="252">Internet Edge</text>
  <text class="caption" x="136" y="276">DNS resolution and public entry point</text>

  <rect class="surface" x="142" y="378" width="354" height="112" rx="18"/>
  <text class="cardTitle" x="174" y="422">User Browser</text>
  <text class="cardBody" x="174" y="450">resolves domain, then connects</text>

  <rect class="endpoint" x="142" y="590" width="354" height="126" rx="18"/>
  <text class="cardTitle" x="174" y="634">DuckDNS</text>
  <text class="cardBody" x="174" y="664">cody-aws-web.duckdns.org</text>
  <text class="cardBody" x="174" y="692">returns 13.125.199.198</text>

  <path class="flowGray" d="M319 490 C319 524 319 554 319 586"/>
  <rect class="labelBg" x="274" y="526" width="90" height="30" rx="8"/>
  <text class="label" x="290" y="546">DNS lookup</text>
  <path class="flowGray" d="M142 653 C92 653 92 434 138 434"/>
  <rect class="labelBg" x="126" y="534" width="94" height="30" rx="8"/>
  <text class="label" x="140" y="554">IP answer</text>

  <rect class="panel" x="588" y="210" width="1228" height="710" rx="26"/>
  <text class="section" x="620" y="252">AWS Seoul Region</text>
  <text class="caption" x="620" y="276">ap-northeast-2</text>

  <rect class="subtle" x="620" y="306" width="1164" height="78" rx="18"/>
  <text class="cardTitle" x="650" y="342">Network Scope</text>
  <text class="cardBody" x="835" y="342">VPC mission6-vpc: 10.0.0.0/16</text>
  <text class="cardBody" x="835" y="368">Public Subnet mission6-public-subnet: 10.0.1.0/24</text>

  <rect class="subtle" x="620" y="420" width="1164" height="218" rx="22"/>
  <text class="section" x="650" y="458">Network Path</text>

  <rect class="network" x="650" y="492" width="278" height="96" rx="18"/>
  <text class="cardTitle" x="686" y="534">Internet Gateway</text>
  <text class="cardBody" x="686" y="562">mission6-igw</text>

  <rect class="network" x="1010" y="492" width="300" height="96" rx="18"/>
  <text class="cardTitle" x="1046" y="532">Route Table</text>
  <text class="cardBody" x="1046" y="560">mission6-public-rt</text>
  <text class="small" x="1046" y="582">0.0.0.0/0 to IGW</text>

  <rect class="security" x="1390" y="468" width="326" height="144" rx="18"/>
  <text class="cardTitle" x="1426" y="506">Security Group</text>
  <text class="cardBody" x="1426" y="536">80: 0.0.0.0/0</text>
  <text class="cardBody" x="1426" y="562">443: 0.0.0.0/0</text>
  <text class="cardBody" x="1426" y="588">22: My IP /32</text>

  <rect class="subtle" x="620" y="682" width="1164" height="198" rx="22"/>
  <text class="section" x="650" y="720">Compute And Runtime</text>

  <rect class="compute" x="650" y="754" width="360" height="96" rx="18"/>
  <text class="cardTitle" x="686" y="790">EC2 Host</text>
  <text class="cardBody" x="686" y="818">mission6-web-ec2</text>
  <text class="small" x="686" y="840">Public 13.125.199.198 / Private 10.0.1.60</text>

  <rect class="runtime" x="1080" y="754" width="300" height="96" rx="18"/>
  <text class="cardTitle" x="1116" y="790">Docker Runtime</text>
  <text class="cardBody" x="1116" y="818">Port mapping 80 -> 80</text>
  <text class="small" x="1116" y="840">container network</text>

  <rect class="app" x="1460" y="754" width="300" height="96" rx="18"/>
  <text class="cardTitle" x="1496" y="790">mission6-nginx</text>
  <text class="cardBody" x="1496" y="818">Image: nginx:alpine</text>
  <text class="small" x="1496" y="840">Container port 80, web response</text>

  <path class="flowBlue" d="M496 434 C548 434 548 540 646 540"/>
  <rect class="labelBg" x="506" y="478" width="238" height="32" rx="9"/>
  <text class="label" x="524" y="499">Browser requests 13.125.199.198</text>

  <path class="flowBlueThin" d="M928 540 L1006 540"/>
  <rect class="labelBg" x="944" y="511" width="70" height="28" rx="8"/>
  <text class="label" x="956" y="531">route</text>

  <path class="flowBlueThin" d="M1310 540 L1386 540"/>
  <rect class="labelBg" x="1326" y="511" width="82" height="28" rx="8"/>
  <text class="label" x="1337" y="531">public</text>

  <path class="flowBlueThin" d="M1553 612 C1553 672 809 672 809 750"/>
  <rect class="labelBg" x="1142" y="648" width="130" height="30" rx="8"/>
  <text class="label" x="1156" y="668">allowed inbound</text>

  <path class="flowBlueThin" d="M1010 802 L1076 802"/>
  <rect class="labelBg" x="1018" y="773" width="82" height="28" rx="8"/>
  <text class="label" x="1031" y="793">80 -> 80</text>

  <path class="flowBlueThin" d="M1380 802 L1456 802"/>
  <rect class="labelBg" x="1398" y="732" width="86" height="28" rx="8"/>
  <text class="label" x="1410" y="752">container</text>

  <text class="caption" x="620" y="948">Traffic summary: browser resolves DuckDNS, enters through IGW, follows the public route, passes Security Group rules, then reaches nginx inside Docker.</text>
</svg>
