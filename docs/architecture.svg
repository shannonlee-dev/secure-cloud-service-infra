<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="860" viewBox="0 0 1360 860" role="img" aria-labelledby="title desc">
  <title id="title">Separate host HTTPS and Docker HTTP exercise stages</title>
  <desc id="desc">DNS lookup precedes public traffic through an Internet Gateway and public subnet to the EC2 host nginx on ports 80 and 443. A separate Docker exercise uses localhost port 8080 to container port 80 and has no TLS. The historical public Docker port 80 exercise requires stopping host nginx.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #1e293b; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #475569; }
      .box { fill: #fff; stroke: #94a3b8; stroke-width: 2; rx: 14; }
      .line { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1360" height="860" fill="#f8fafc"/>
  <text class="title" x="50" y="56">Host HTTPS and separate Docker HTTP exercise</text>
  <text class="small" x="50" y="90">Reproduction model with your own DNS and new EC2 IP. Historical screenshots are separate evidence.</text>

  <rect class="box" x="50" y="130" width="260" height="98"/>
  <text class="heading" x="74" y="164">Browser / admin PC</text>
  <text class="body" x="74" y="199">Resolves your domain</text>
  <rect class="box" x="410" y="130" width="275" height="98"/>
  <text class="heading" x="434" y="164">Your DNS provider</text>
  <text class="body" x="434" y="199">A record: new public IPv4</text>
  <path class="line" d="M310 158 H410"/>
  <path class="line" d="M410 208 H310"/>
  <text class="small" x="323" y="148">lookup</text>
  <text class="small" x="327" y="230">IP reply</text>

  <rect class="box" x="50" y="285" width="255" height="98"/>
  <text class="heading" x="74" y="320">Public HTTP / HTTPS</text>
  <text class="body" x="74" y="353">Connect to new EC2 IP</text>
  <path class="line" d="M180 228 V285"/>
  <rect class="box" x="365" y="285" width="240" height="98"/>
  <text class="heading" x="389" y="320">Internet Gateway</text>
  <text class="body" x="389" y="353">Attached to your VPC</text>
  <rect class="box" x="665" y="285" width="285" height="98"/>
  <text class="heading" x="689" y="320">Public subnet + route</text>
  <text class="body" x="689" y="353">0.0.0.0/0 via IGW</text>
  <rect class="box" x="1010" y="285" width="300" height="98"/>
  <text class="heading" x="1034" y="320">Security Group</text>
  <text class="body" x="1034" y="350">80 / 443: service scope</text>
  <text class="small" x="1034" y="372">22: actual admin IPv4 /32</text>
  <path class="line" d="M305 335 H365 M605 335 H665 M950 335 H1010"/>

  <rect x="170" y="455" width="1140" height="305" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text class="heading" x="194" y="489">EC2 host — distinct execution stages</text>
  <rect class="box" x="205" y="510" width="1055" height="94"/>
  <text class="heading" x="230" y="545">Stage A: host nginx — ports 80 and 443</text>
  <text class="body" x="230" y="577">HTTP redirect and TLS certificate managed by host Certbot /etc/letsencrypt</text>
  <path class="line" d="M1160 383 V510"/>

  <rect class="box" x="205" y="630" width="1055" height="94"/>
  <text class="heading" x="230" y="665">Stage B: local HTTP only</text>
  <text class="body" x="230" y="698">EC2 curl</text>
  <path class="line" d="M330 691 H450"/>
  <text class="body" x="480" y="698">127.0.0.1:8080 → Docker nginx:80 (no TLS)</text>

  <text class="small" x="50" y="798">Historical Docker 0.0.0.0:80 → 80 stage: stop host nginx first; host HTTPS is then unavailable.</text>
  <text class="small" x="50" y="827">Host certificate evidence and a Docker port-80 screenshot do not establish Docker HTTPS.</text>
</svg>
